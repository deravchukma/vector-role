---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: oraclelinux_8
    image: oraclelinux:8
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
  - name: ubuntu_latest
    image: ubuntu:latest
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
verifier:
  name: ansible
