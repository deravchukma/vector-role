---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: oraclelinux_8
    image: docker.io/library/oraclelinux:8
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /usr/sbin/init
    systemd: always
provisioner:
  name: ansible
  playbooks:
    converge: ../default/converge.yml
    verify: ../default/verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - verify
    - destroy
