---
- name: Vector | Get distrib
  ansible.builtin.get_url:
    url: "{{ vector_url }}"
    dest: "./{{ vector_archive }}"
    mode: "0644"
  tags: [download]

- name: Vector | Create install directory
  become: true
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    mode: "0755"
  tags: [install]

- name: Vector | Unpack distrib
  become: true
  ansible.builtin.unarchive:
    src: "./{{ vector_archive }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=2]
    creates: "{{ vector_install_dir }}/bin/vector"
  tags: [install]

- name: Vector | Install binary
  become: true
  ansible.builtin.file:
    src: "{{ vector_install_dir }}/bin/vector"
    dest: /usr/bin/vector
    state: link
  notify: Restart vector service
  tags: [install]

- name: Vector | Create group
  become: true
  ansible.builtin.group:
    name: vector
    system: true
  tags: [install]

- name: Vector | Create user
  become: true
  ansible.builtin.user:
    name: vector
    group: vector
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [install]

- name: Vector | Create config directory
  become: true
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: "0755"
  tags: [config]

- name: Vector | Create data directory
  become: true
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: vector
    group: vector
    mode: "0750"
  tags: [install]

- name: Vector | Deploy config
  become: true
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: "0644"
    validate: /usr/bin/vector validate --no-environment --config-yaml %s
  notify: Restart vector service
  tags: [config]

- name: Vector | Install systemd unit
  become: true
  ansible.builtin.copy:
    src: "{{ vector_install_dir }}/etc/systemd/vector.service"
    dest: /etc/systemd/system/vector.service
    remote_src: true
    mode: "0644"
  notify: Restart vector service
  tags: [install]

- name: Vector | Start service
  become: true
  ansible.builtin.systemd_service:
    name: vector
    state: started
    enabled: true
    daemon_reload: true
